# =============================================================================
# hud-build.conf — shared configuration for hud-build and hud-test
#
# Installed at /etc/hud-build.conf. Both scripts source it, so the rootfs they
# use is defined in exactly one place.
#
# This file exists because it already went wrong once: hud-build was switched to
# the minimal rootfs and hud-test was not, because each script carried its own
# copy of the path. Builds were then validated against a stripped root while
# every install test ran against a root that still had all 245 packages in it —
# so the test could not fail the way it was designed to, and each one spent two
# minutes unpacking 8.3 GB to do it.
#
# Anything set here can still be overridden per-run with HUD_BASE_ROOTFS.
# =============================================================================

HUD_BUILD_ROOT="${HUD_BUILD_ROOT:-/var/hud-build}"

# The default build/test environment.
#
# MINIMAL is correct for both building and testing. It is the base BlackFlag
# system plus the nine packages the hud client needs to fetch anything; nothing
# the repository installs is present. A build succeeds only if its Build-Depends
# actually name what it needs, and an install test exercises a root that does
# not already contain the package under test.
#
# The full rootfs is a snapshot of a populated bf-repo. It is kept for
# reproducing an old build in the environment it was originally made in. Do not
# make it the default: every build passes in it regardless of whether its
# dependencies are declared correctly.
HUD_ROOTFS_DEFAULT="${HUD_ROOTFS_DEFAULT:-$HUD_BUILD_ROOT/base-rootfs-minimal.tar.zst}"
